<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stanford Foraging Maps</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      color: white;
      padding: 40px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 50px;
      opacity: 0.9;
    }

    .maps-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .map-card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      width: 280px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: transform 0.3s, box-shadow 0.3s;
      text-decoration: none;
      color: #333;
    }

    .map-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .map-icon {
      font-size: 64px;
      margin-bottom: 15px;
    }

    .map-card h2 {
      margin: 0 0 10px 0;
      color: #2c5f2d;
    }

    .map-card p {
      margin: 0;
      color: #666;
      line-height: 1.6;
    }

    .tea-card h2 {
      color: #6B4423;
    }

    footer {
      margin-top: 60px;
      opacity: 0.8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stanford Foraging Maps</h1>
    <p class="subtitle">Discover edible plants around campus</p>

    <div class="maps-container">
      <a href="fruit-map/index.html" class="map-card">
        <div class="map-icon">🍊</div>
        <h2>Fruit Map</h2>
        <p>An interactive map of fruit trees on Stanford's campus.</p>
      </a>

      <a href="tea-map/index.html" class="map-card tea-card">
        <div class="map-icon">🍵</div>
        <h2>Tea & Herbs Map</h2>
        <p>Forage for tea, seasonings, and edible annuals.</p>
      </a>
    </div>

    <footer>
      <p>Created by Edie Chamberlain | Class of '27</p>
    </footer>
  </div>
</body>
</html>
